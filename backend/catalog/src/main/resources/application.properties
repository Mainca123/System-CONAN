quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:${CATALOG_PORT:8081}}
quarkus.http.cors.enabled=true
quarkus.http.limits.max-body-size=256K

# Database (MySQL)
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:mysql://mysql:3306/catalog?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&characterEncoding=UTF-8}
%dev.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:mysql://localhost:3307/catalog?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC&characterEncoding=UTF-8}
quarkus.datasource.username=${DATABASE_USER:catalog}
quarkus.datasource.password=${DATABASE_PASSWORD:demo_catalog}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=15S
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.background-validation-interval=2M

# Flyway migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# OIDC / Keycloak
quarkus.oidc.auth-server-url=${KEYCLOAK_INTERNAL:http://localhost:8181}/realms/conan
quarkus.oidc.token.issuer=${KEYCLOAK_PUBLIC:http://localhost:8181}/realms/conan
quarkus.oidc.client-id=conan-web
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.audience=conan-api
quarkus.oidc.connection-delay=2M
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=protocol/openid-connect/certs

# Common module indexing
quarkus.index-dependency.common.group-id=vn.conan
quarkus.index-dependency.common.artifact-id=common
